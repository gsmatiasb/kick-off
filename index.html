<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Kick Off</title>
<meta name="theme-color" content="#09090a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kick Off">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Kick Off · visual "carbono": fundo preto, cartões grafite, saldo em destaque, ações rápidas circulares.
   Celular: barra de abas fixa embaixo. Computador (≥1000px): menu lateral e conteúdo em colunas. */
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --bg:#09090a;
  --side-bg:#0e0e10;
  --card:#141416;
  --card-2:#1c1c1f;
  --card-3:#27272b;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.13);
  --fg:#f5f5f7;
  --fg-2:#a6a6ae;
  --fg-3:#6f6f78;
  --ink:#0a0a0b;
  --green:#5fd08d;
  --red:#ff6f66;
  --amber:#f4b94e;
  --blue:#7fb2ff;
  --radius:20px;
  --pad:max(16px, env(safe-area-inset-left,0px));
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --side:260px;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea,.t,.sub{-webkit-user-select:text;user-select:text}
input,select,textarea{font:inherit;color:inherit;font-size:16px!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--red)} .warn{color:var(--amber)} .info{color:var(--blue)} .mute{color:var(--fg-3)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex:none}

/* ---------- estrutura ---------- */
.sidenav{display:none}
.app{position:relative;padding:0 var(--pad) calc(96px + var(--safe-b))}
.wrap{max-width:1120px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:20;margin:0 calc(-1 * var(--pad));padding:var(--safe-t) var(--pad) 0;
  border-bottom:1px solid transparent;transition:background .25s, border-color .25s}
.topbar.scrolled{background:rgba(9,9,10,.84);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border-color:var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:58px}
.topbar .side{min-width:100px;display:flex;align-items:center;gap:8px}
.topbar .side.r{justify-content:flex-end}
.mini-title{flex:1;text-align:center;font-weight:600;font-size:16px;opacity:0;transform:translateY(4px);transition:.25s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar.scrolled .mini-title{opacity:1;transform:none}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:22px;height:28px;object-fit:contain}
.brand b{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;font-size:17px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--card-2);border:1px solid var(--line);transition:background .2s, transform .2s var(--spring)}
.icon-btn:hover{background:var(--card-3)} .icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:19px;height:19px}
.avatar{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,#34343a,#1c1c1f);
  border:1px solid var(--line-strong);font-weight:700;font-size:13.5px;letter-spacing:.03em;transition:transform .2s var(--spring)}
button.avatar:active{transform:scale(.9)}
.avatar .dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border:2.5px solid var(--bg)}
.back{display:flex;align-items:center;gap:2px;font-size:16px;font-weight:600;padding:6px 8px 6px 0;transition:opacity .2s}
.back:hover{opacity:.75}
.back svg{width:22px;height:22px}

/* Barra de abas (celular) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px 6px calc(6px + var(--safe-b));background:rgba(12,12,14,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.tabbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;font-size:10.5px;font-weight:600;color:var(--fg-3);transition:color .2s}
.tabbar button::before{content:"";position:absolute;top:-7px;width:22px;height:3px;border-radius:0 0 3px 3px;background:#fff;transform:scaleX(0);transition:transform .3s var(--spring)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current=page]{color:var(--fg)}
.tabbar button[aria-current=page]::before{transform:none}

/* Menu lateral (computador) */
@media (min-width:1000px){
  :root{--pad:clamp(28px,3.4vw,52px)}
  .sidenav{display:flex;flex-direction:column;gap:6px;position:fixed;inset:0 auto 0 0;width:var(--side);z-index:25;padding:28px 16px 18px;background:var(--side-bg);border-right:1px solid var(--line)}
  .app{margin-left:var(--side);padding-bottom:64px}
  .tabbar{display:none}
  .topbar .brand,.topbar .tb-avatar{display:none}
  .topbar .wrap{height:64px}
  body.no-shell .app{margin-left:0}
}
.sn-brand{display:flex;align-items:center;gap:12px;padding:0 10px 24px}
.sn-brand img{width:30px;height:37px;object-fit:contain}
.sn-brand b{display:block;font-family:var(--font-display);font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sn-brand span{display:block;color:var(--fg-3);font-size:12.5px;font-weight:600}
.sn-nav{display:flex;flex-direction:column;gap:2px}
.sn-nav button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;color:var(--fg-2);font-weight:600;transition:background .15s,color .15s}
.sn-nav button:hover{background:var(--card);color:var(--fg)}
.sn-nav button[aria-current=page]{background:var(--card-2);color:var(--fg)}
.sn-nav svg{width:21px;height:21px}
.sn-cta{margin:16px 4px 0}
.sn-foot{margin-top:auto}
.sn-acc{display:flex;align-items:center;gap:11px;width:100%;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--card);transition:background .15s}
.sn-acc:hover{background:var(--card-2)}
.sn-acc .who{min-width:0;flex:1}
.sn-acc b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-acc small{display:flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12px;font-weight:600}

/* ---------- títulos ---------- */
.large{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 20px}
.large h1{font-family:var(--font-display);font-size:32px;line-height:1.08;letter-spacing:-.03em;font-weight:800;margin:0;text-wrap:balance}
.large .eyebrow{color:var(--fg-3);font-size:13px;font-weight:600;margin-bottom:5px}
.greet{margin:6px 0 18px}
.greet h1{font-family:var(--font-display);font-size:28px;line-height:1.1;letter-spacing:-.03em;font-weight:800;margin:0}
.greet p{margin:4px 0 0;color:var(--fg-2);font-size:14px}
.greet p::first-letter{text-transform:uppercase}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 2px 10px}
.section-h h2{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:0}
.section-h h2 small{color:var(--fg-3);font-weight:600;font-size:15px;margin-left:4px}
.section-h .link{color:var(--fg-2);font-size:14px;font-weight:600;transition:color .2s}
.section-h .link:hover{color:var(--fg)}
.caption{color:var(--fg-3);font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin:24px 4px 8px}
.foot{color:var(--fg-3);font-size:13px;margin:8px 4px 0;line-height:1.45}

/* ---------- superfícies ---------- */
.card,.glass{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}

/* Cartão de saldo (com a textura da marca) */
.balance{position:relative;overflow:hidden;isolation:isolate;border-radius:24px;padding:20px 22px 18px;
  background:
    linear-gradient(125deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,0) 34%, rgba(255,255,255,0) 70%, rgba(255,255,255,.05) 100%),
    linear-gradient(rgba(12,12,13,.6), rgba(12,12,13,.76)),
    url("img/textura.jpg") center/cover no-repeat, #1a1a1c;
  border:1px solid var(--line-strong);box-shadow:0 22px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07)}
.balance::after{content:"";position:absolute;right:-26px;bottom:-46px;width:190px;height:232px;z-index:-1;opacity:.07;
  background:url("img/logo.png") center/contain no-repeat;transform:rotate(-10deg)}
.balance[data-action]{cursor:pointer}
.balance .bh{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--fg-2);font-size:14px;font-weight:600}
.balance .bh .l{display:flex;align-items:center;gap:8px}
.balance .bh svg{width:17px;height:17px}
.eye{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--fg);transition:background .2s, transform .2s var(--spring)}
.eye:hover{background:rgba(255,255,255,.14)} .eye:active{transform:scale(.9)}
.eye svg{width:18px;height:18px}
.balance .bv{font-family:var(--font-display);font-size:38px;font-weight:700;letter-spacing:-.035em;margin:12px 0 4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.1}
.balance .bs{color:var(--fg-3);font-size:13px}
.balance .bf{display:flex;align-items:flex-end;gap:14px 26px;flex-wrap:wrap;margin-top:18px;padding-top:15px;border-top:1px solid var(--line-strong)}
.balance .bf > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.balance .bf span{font-size:12px;color:var(--fg-3);font-weight:600}
.balance .bf b{font-size:16px;font-variant-numeric:tabular-nums}
.balance .bf .btn{margin-left:auto}

/* Ações rápidas */
.quick{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:18px calc(-1 * var(--pad)) 0;padding:2px var(--pad) 4px}
.quick::-webkit-scrollbar{display:none}
.qa{flex:1 0 76px;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--fg-2);text-align:center;line-height:1.2}
.qa .c{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line);color:var(--fg);transition:transform .25s var(--spring), background .2s}
.qa:hover .c{background:var(--card-3)} .qa:hover{color:var(--fg)}
.qa:active .c{transform:scale(.88)}
.qa .c svg{width:22px;height:22px}

/* Grades de painel */
.top-grid{display:grid;gap:0 18px;grid-template-columns:minmax(0,1fr);grid-template-areas:"bal" "quick" "kpi" "month"}
.top-grid > .balance{grid-area:bal} .top-grid > .quick{grid-area:quick} .top-grid > .kpi-grid{grid-area:kpi} .top-grid > .month{grid-area:month;margin-top:12px}
@media (min-width:1000px){
  .top-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"bal month" "quick quick" "kpi kpi"}
  .top-grid > .month{margin-top:0}
  .quick{margin-inline:0;padding-inline:0;gap:10px;margin-top:22px}
  .qa{flex:0 0 92px}
}
.cols{display:grid;gap:0 22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* Indicadores */
.kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
@media (min-width:760px){.kpi-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:15px 16px;display:flex;flex-direction:column;gap:5px;min-width:0}
.kpi .k{color:var(--fg-2);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.kpi .v{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.025em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.15}
.kpi .s{color:var(--fg-3);font-size:12.5px}

/* Fluxo do mês */
.month{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.month .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.month .mh span{color:var(--fg-2);font-size:14px;font-weight:600}
.month .mh small{color:var(--fg-3);font-size:12.5px;font-weight:600}
.month .mv{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.flow{display:flex;flex-direction:column;gap:10px}
.flow .fl{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:13px}
.flow .fl > span:first-child{color:var(--fg-2);font-weight:600}
.flow .fl b{font-variant-numeric:tabular-nums;font-weight:600}
.track{height:8px;border-radius:8px;background:var(--card-3);overflow:hidden}
.track i{display:block;height:100%;border-radius:8px;min-width:2px}
.track i.in{background:var(--green)} .track i.out{background:var(--red)}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;
  background:var(--card-2);border:1px solid var(--line-strong);transition:background .2s, transform .15s, opacity .2s;white-space:nowrap}
.btn:hover{background:var(--card-3)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.6}
.btn.primary{background:#fff;color:var(--ink);border-color:#fff}
.btn.primary:hover{background:#e8e8eb}
.btn.danger{color:var(--red)}
.btn.sm{height:36px;padding:0 15px;font-size:14px}
.btn svg{width:18px;height:18px}
.round-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fff;color:var(--ink);transition:transform .25s var(--spring), background .2s}
.round-btn:hover{background:#e8e8eb;transform:scale(1.06)}
.round-btn:active{transform:scale(.92)}
.round-btn svg{width:21px;height:21px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 140px}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:62px;position:relative;text-align:left;width:100%;transition:background .15s}
.list > .row + .row::before,.list > .row + .item::before,.list > .item + .row::before,.list > .item + .item::before,.list > .row + .add-row::before,.list > .item + .add-row::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.row.tap{cursor:pointer}
.row.tap:hover{background:rgba(255,255,255,.03)}
.row.tap:active{background:rgba(255,255,255,.06)}
.row.tap:hover .chev{transform:translateX(3px);color:var(--fg-2)}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--card-3);color:var(--fg-2)}
.ic svg{width:18px;height:18px}
.ic.g{color:var(--green);background:rgba(95,208,141,.12)} .ic.r{color:var(--red);background:rgba(255,111,102,.12)}
.ic.a{color:var(--amber);background:rgba(244,185,78,.12)} .ic.b{color:var(--blue);background:rgba(127,178,255,.12)}
.ic.s{color:var(--fg)}
.ic.ini{font-weight:700;font-size:13px;color:var(--fg);letter-spacing:.02em}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:block;color:var(--fg-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .end .v{font-weight:600;font-variant-numeric:tabular-nums}
.chev{width:16px;height:16px;color:var(--fg-3);flex:none;transition:transform .25s var(--spring), color .2s}
.prog{display:block;height:4px;border-radius:4px;background:var(--card-3);overflow:hidden;margin-top:8px;max-width:240px}
.prog i{display:block;height:100%;border-radius:4px;background:var(--green)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card-3);color:var(--fg-2);white-space:nowrap}
.pill.transito{color:var(--blue);background:rgba(127,178,255,.12)}
.pill.brasil{color:var(--amber);background:rgba(244,185,78,.13)} .pill.concluido{color:var(--green);background:rgba(95,208,141,.12)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;border:1px solid var(--line-strong);color:var(--fg-2);vertical-align:2px;margin-left:5px}
.chip.v{color:var(--ink);background:linear-gradient(180deg,#e4e5e9,#b9bac0);border-color:transparent}
.chip.v.player{background:linear-gradient(180deg,#f1d99a,#cfae5e)}
.chip.v.retro{background:linear-gradient(180deg,#d9c2a6,#b39776)}
.day{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 4px 8px;font-size:13px;font-weight:700;color:var(--fg-2)}
.day:first-child{margin-top:4px}
.day::first-letter{text-transform:uppercase}
.day span:last-child{font-variant-numeric:tabular-nums;font-weight:600;color:var(--fg-3)}

/* ---------- campos ---------- */
.field-row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:56px;position:relative}
.list > .field-row + .field-row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.field-row label{flex:1;min-width:0;color:var(--fg);padding:9px 0}
.field-row .hint{display:block;color:var(--fg-3);font-size:12.5px}
.field-row .val{color:var(--fg-2);font-variant-numeric:tabular-nums;text-align:right}
.field-row .val.pos{color:var(--green)} .field-row .val.neg{color:var(--red)} .field-row .val.warn{color:var(--amber)} .field-row .val.info{color:var(--blue)}
.money{display:flex;align-items:center;gap:4px;border-radius:12px;padding:7px 11px;background:var(--bg);border:1px solid var(--line-strong);transition:border-color .2s}
.money:focus-within{border-color:#fff}
.money span{color:var(--fg-3);font-size:14px}
.money input{width:96px;text-align:right;background:none;border:0;outline:none;font-variant-numeric:tabular-nums;font-weight:600}
.notes{display:block;width:100%;min-height:96px;resize:vertical;background:none;border:0;outline:none;padding:14px 16px;color:var(--fg)}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.seg button{position:relative;z-index:1;height:34px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--fg-2);transition:color .25s;white-space:nowrap;padding:0 8px;text-align:center}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:#fff;transition:transform .4s var(--spring), width .4s var(--spring)}
.f .seg{margin:6px 0 2px;background:var(--bg)}
.search{display:flex;align-items:center;gap:9px;height:46px;padding:0 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;transition:border-color .2s}
.search:focus-within{border-color:var(--line-strong)}
.search svg{width:18px;height:18px;color:var(--fg-3)}
.search input{flex:1;background:none;border:0;outline:none;min-width:0}
.toolbar{display:grid;gap:0 12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.toolbar{grid-template-columns:minmax(0,1fr) 380px}}

/* ---------- pacote ---------- */
.pk-head{padding:20px 20px 18px}
.pk-head h1{font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.025em;margin:0 0 6px;line-height:1.15;text-wrap:balance}
.pk-head .meta{color:var(--fg-2);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pk-recv{padding:0 20px 18px;font-size:13px;color:var(--fg-2)}
.pk-recv .prog{max-width:none;height:6px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line)}
.kpis > div{padding:14px 20px;min-width:0}
.kpis > div + div{border-left:1px solid var(--line)}
.kpis .k{font-size:12px;color:var(--fg-3);font-weight:600}
.kpis .v{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;margin-top:2px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis > div:nth-child(3){border-left:0}.kpis > div:nth-child(n+3){border-top:1px solid var(--line)}.kpis > div{padding:12px 16px}}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.step{display:flex;flex-direction:column;gap:9px;padding:4px 0;font-size:12.5px;font-weight:600;color:var(--fg-3);text-align:left;transition:color .2s}
.step::before{content:"";height:5px;width:100%;border-radius:5px;background:var(--card-3);transition:background .3s}
.step:hover{color:var(--fg)}
.step.done{color:var(--fg-2)} .step.done::before{background:#77777f}
.step.cur{color:var(--fg)} .step.cur::before{background:#fff}
.step.cur.transito::before{background:var(--blue)} .step.cur.brasil::before{background:var(--amber)} .step.cur.concluido::before{background:var(--green)}
.pk-grid{display:grid;gap:0 22px;grid-template-columns:minmax(0,1fr);grid-template-areas:"a" "c" "b"}
.pk-grid .area-a{grid-area:a} .pk-grid .area-b{grid-area:b} .pk-grid .area-c{grid-area:c}
@media (min-width:1000px){.pk-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-areas:"a c" "b c";align-items:start}.pk-grid .area-c .section-h{margin-top:24px}}
.item{display:flex;gap:12px;padding:15px 16px;position:relative;cursor:pointer;transition:background .15s}
.item:hover{background:rgba(255,255,255,.03)}
.item .shirt{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--card-3);color:var(--fg)}
.item .shirt svg{width:19px;height:19px}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .sub{color:var(--fg-2);font-size:13.5px}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-top .pay{padding:2px 0 0;flex:none}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:11px;border-radius:14px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.nums > div{padding:9px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.nums > div + div{border-left:1px solid var(--line)}
.nums span{font-size:11.5px;color:var(--fg-3);font-weight:600}
.nums b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.calc b{color:var(--fg-2);font-weight:600}
.preview{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--bg);border:1px solid var(--line-strong);display:flex;flex-direction:column;gap:6px;font-size:14px}
.preview .ln{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.preview .ln span:first-child{color:var(--fg-2)}
.preview .big{font-size:17px;font-weight:700}
.preview .formula{color:var(--fg-3);font-size:12.5px}
.pay{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--fg-2);padding:4px 0 0}
.sw{width:44px;height:26px;border-radius:99px;background:var(--card-3);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .35s var(--spring)}
.pay.on .sw{background:var(--green)}
.pay.on .sw::after{transform:translateX(18px)}
.pay.on{color:var(--green)}
.add-row{display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:600;width:100%;position:relative;transition:background .15s}
.add-row:hover{background:rgba(255,255,255,.03)}
.add-row .ic{background:none;border:1px dashed var(--line-strong);color:var(--fg)}

/* ---------- relatórios ---------- */
.chart{position:relative;padding:18px 18px 10px}
.chart .ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.chart .ch b{font-size:15px}
.chart .ch span{color:var(--fg-3);font-size:12.5px;font-weight:600}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{fill:var(--fg-3);font-size:11px;font-family:var(--font);font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:pointer;outline:none}
.chart .hit:hover,.chart .hit:focus-visible{fill:rgba(255,255,255,.04)}
.tip{position:absolute;top:44px;left:0;transform:translateX(-50%);pointer-events:none;z-index:5;min-width:170px;padding:10px 12px;border-radius:12px;
  background:#232327;border:1px solid var(--line-strong);box-shadow:0 14px 30px rgba(0,0,0,.5);font-size:12.5px;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip b{display:block;font-size:13px;margin-bottom:5px}
.tip .ln{display:flex;justify-content:space-between;gap:16px;color:var(--fg-2);line-height:1.6}
.tip .ln span:last-child{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
.hbars{display:flex;flex-direction:column;gap:14px;padding:18px}
.hbar .hl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:7px}
.hbar .hl span:first-child{font-weight:600}
.hbar .hl span:last-child{color:var(--fg-2);font-variant-numeric:tabular-nums}
.hbar .track{height:10px}
.hbar .track i{background:#d6d6db}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{text-align:right;color:var(--fg-3);font-weight:600;font-size:12px;padding:12px 16px 10px}
.tbl td{text-align:right;padding:11px 16px;border-top:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td:first-child{font-weight:600}
.tbl td:first-child::first-letter{text-transform:uppercase}

/* ---------- estados ---------- */
.empty{padding:32px 22px;text-align:center;color:var(--fg-2)}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.empty .btn{margin-top:16px}
.skel{height:96px;border-radius:var(--radius);background:linear-gradient(90deg,var(--card) 0%,var(--card-2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.4s infinite linear;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:13px 16px;font-size:13.5px;color:var(--fg-2);margin-bottom:16px}
.banner svg{width:18px;height:18px;flex:none;color:var(--amber);margin-top:1px}

/* ---------- login ---------- */
.login{max-width:400px;margin:0 auto;padding-top:calc(9vh + var(--safe-t));text-align:center}
.login .logo-xl{display:block;width:62px;height:76px;object-fit:contain;margin:0 auto 22px}
.login h1{font-family:var(--font-display);font-size:30px;letter-spacing:-.03em;font-weight:800;margin:0}
.login .lead{color:var(--fg-2);margin:8px auto 0;max-width:340px}
.login form,.login .acts{text-align:left;margin-top:28px}
.login .err{color:var(--red);text-align:center;margin-top:12px;min-height:20px}
.login .secure{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--fg-3);font-size:12.5px;margin-top:18px}
.login .secure svg{width:14px;height:14px}

/* ---------- janela (sheet) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .3s}
.sheet-wrap.open .backdrop{opacity:1}
.sheet{position:relative;width:min(600px,100%);max-height:92%;overflow:auto;border-radius:26px 26px 0 0;background:#141416;border:1px solid var(--line-strong);border-bottom:0;
  box-shadow:0 -20px 60px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .45s var(--ease);padding-bottom:calc(20px + var(--safe-b))}
.sheet-wrap.open .sheet{transform:none}
@media (min-width:640px){.sheet-wrap{align-items:center}.sheet{border-radius:26px;border-bottom:1px solid var(--line-strong);transform:translateY(30px) scale(.97);opacity:0;transition:transform .4s var(--spring), opacity .25s}.sheet-wrap.open .sheet{transform:none;opacity:1}}
.grabber{width:38px;height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin:8px auto 0}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 16px 8px;position:sticky;top:0;z-index:2;background:linear-gradient(180deg,#141416 72%,rgba(20,20,22,0))}
.sheet-h h3{margin:0;font-size:16.5px;font-weight:700;text-align:center}
.sheet-h .l{justify-self:start;color:var(--fg-2);padding:8px 4px}
.sheet-h .l:hover{color:var(--fg)}
.sheet-h .r{justify-self:end;font-weight:700;font-size:14px;color:var(--ink);background:#fff;padding:7px 15px;border-radius:999px;transition:transform .2s var(--spring)}
.sheet-h .r:active{transform:scale(.94)}
.sheet-body{padding:6px 16px 8px}
.sheet .list{background:var(--card-2);border-radius:18px;border:1px solid var(--line)}
.sheet .card,.sheet .glass{background:var(--card-2)}
.f{display:flex;flex-direction:column;gap:3px;padding:11px 16px;position:relative}
.list > .f + .f::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.f > span{font-size:12px;color:var(--fg-3);font-weight:600}
.f input,.f select,.f textarea{background:none;border:0;outline:none;padding:3px 0;width:100%}
.f select option{background:#1c1c1f}
.f textarea{min-height:64px;resize:vertical}
.f .pre{display:flex;align-items:center;gap:6px}
.f .pre em{font-style:normal;color:var(--fg-3)}
.f.err > span{color:var(--red)}
.sheet .note{color:var(--fg-3);font-size:13px;margin:10px 6px 0}
.sheet .extra{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.sheet .extra .btn{width:100%}

/* ---------- aviso ---------- */
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,calc(-100% - 40px));opacity:0;z-index:60;
  padding:11px 18px;border-radius:99px;background:#fff;color:var(--ink);font-weight:600;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.5);
  transition:transform .45s var(--spring), opacity .25s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ---------- transições ---------- */
.view{animation:in .4s var(--ease) both}
.view.push{animation:push .45s var(--ease) both}
.view.pop{animation:pop .4s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@keyframes push{from{opacity:0;transform:translateX(36px)}}
@keyframes pop{from{opacity:0;transform:translateX(-28px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:420px){.large h1{font-size:28px}.balance .bv{font-size:32px}.kpi .v{font-size:19px}.item .shirt{display:none}.list > .item + .item::before,.list > .item + .add-row::before{left:16px}}
</style>

</head>
<body>

<script>
(() => {
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brlRaw = v => BRL.format(+v || 0);
const brl = v => S.oculto ? "R$ ••••" : brlRaw(v); // respeita "ocultar valores"
const usd = v => "US$ " + (+v||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const signed = v => (v>0?"+ ":v<0?"− ":"") + brl(Math.abs(v));
const signedRaw = v => (v>0?"+ ":v<0?"− ":"") + brlRaw(Math.abs(v));
const num = v => { if (v==null||v==="") return 0; if (typeof v==="number") return v;
  let s = String(v).replace(/[^\d,.\-]/g,""); if (s.includes(",")) s = s.replace(/\./g,"").replace(",","."); const n = parseFloat(s); return isFinite(n)?Math.round(n*100)/100:0; };
const moneyStr = v => (v||v===0) && +v ? (+v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}) : "";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const fdate = iso => { if(!iso) return "—"; const [y,m,d]=String(iso).split("-"); return `${d}/${m}/${y}`; };
const fts = ts => ts ? new Date(ts).toLocaleDateString("pt-BR") : "—";
const fdt = ts => ts ? new Date(ts).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
const clone = o => JSON.parse(JSON.stringify(o));
const sum = (a,f) => a.reduce((s,x)=>s+(+f(x)||0),0);

const VERSOES = [["fan","Fan"],["player","Player"],["retro","Retro"]];
const VERSAO = Object.fromEntries(VERSOES);
const vchip = r => r.versao && VERSAO[r.versao] ? `<span class="chip v ${esc(r.versao)}">${esc(VERSAO[r.versao])}</span>` : "";
const vtxt = r => r.versao && VERSAO[r.versao] ? " " + VERSAO[r.versao] : "";
const STATUS = {pedido:"Pedido feito", transito:"Em trânsito", brasil:"No Brasil", concluido:"Concluído"};
const STATUS_SHORT = {pedido:"Pedido", transito:"Trânsito", brasil:"No Brasil", concluido:"Concluído"};
const ICONS = {
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 3.5 7.5v9L12 21l8.5-4.5v-9z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/></svg>',
  shirt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M8.5 3.5 4 6l-1.5 4.5 3 1.2V20.5h13v-8.8l3-1.2L20 6l-4.5-2.5c-.6 1.5-2 2.5-3.5 2.5S9.1 5 8.5 3.5z"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',

/* ---------- estado e armazenamento (Supabase + cache offline) ---------- */
const S = { pacotes:[], lancamentos:[], receber:[], caixa:{valor:0, em:0},
  ready:false, user:null, local:false, membro:null, syncErr:null, syncing:false, readOnly:false,
  tab:"resumo", detail:null, filtro:"abertos", busca:"", finTab:"extrato", anim:"in", relPer:6, oculto:false, nome:"" };
const CFG = window.APP_CONFIG || {};
const sb = (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true}}) : null;
const LS = "controle-camisetas-cache-v1", LQ = "controle-camisetas-fila-v1";
const store = { get(k,d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
const loadCache = () => { const d = store.get(LS, null); if (d) Object.assign(S, {pacotes:d.pacotes||[], lancamentos:d.lancamentos||[], receber:d.receber||[], caixa:d.caixa||{valor:0,em:0}}); };
const saveCache = () => store.set(LS, {pacotes:S.pacotes, lancamentos:S.lancamentos, receber:S.receber, caixa:S.caixa});
let fila = store.get(LQ, []);
S.oculto = store.get("kickoff-oculto", false); // preferência só deste aparelho
S.nome = store.get("kickoff-nome", "");
function enqueue(op){ fila = fila.filter(o => !(o.colecao===op.colecao && o.id===op.id)); fila.push(op); store.set(LQ, fila); updateSync(); flush(); }
let flushing = false, retryT = null;
async function flush(){
  if (!sb || !S.user || S.membro !== true || flushing || !fila.length || !navigator.onLine) { updateSync(); return; }
  flushing = true; updateSync();
  try {
    while (fila.length){
      const op = fila[0];
      const { error } = op.tipo === "del"
        ? await sb.from("registros").delete().match({colecao:op.colecao, id:op.id})
        : await sb.from("registros").upsert({colecao:op.colecao, id:op.id, dados:op.dados, atualizado_em:new Date().toISOString(), atualizado_por:S.user.id}, {onConflict:"colecao,id"});
      if (error) throw error;
      fila.shift(); store.set(LQ, fila);
    }
    S.syncErr = null;
  } catch (e) { S.syncErr = (e && e.message) || "Falha ao sincronizar"; clearTimeout(retryT); retryT = setTimeout(flush, 20000); }
  flushing = false; updateSync();
}
async function pull(){
  if (!sb || !S.user || S.membro !== true || !navigator.onLine || S.syncing) return;
  await flush(); if (fila.length) return;
  S.syncing = true; updateSync();
  try {
    const rows = []; let from = 0;
    for (;;) { const { data, error } = await sb.from("registros").select("colecao,id,dados").range(from, from+999); if (error) throw error; rows.push(...data); if (data.length < 1000) break; from += 1000; }
    if (fila.length) return;
    const n = {pacotes:[], lancamentos:[], receber:[], caixa:{valor:0, em:0}};
    for (const r of rows){ if (r.colecao==="config" && r.id==="caixa") n.caixa = r.dados || n.caixa; else if (n[r.colecao]) n[r.colecao].push({...r.dados, id:r.id}); }
    Object.assign(S, n); S.syncErr = null; saveCache(); requestRender();
  } catch (e) { S.syncErr = (e && e.message) || "Falha ao carregar"; }
  finally { S.syncing = false; updateSync(); }
}
function aplicarRemoto(row, apagado){
  if (!row || !row.colecao || !row.id) return;
  if (fila.some(o => o.colecao===row.colecao && o.id===row.id)) return; // alteração local ainda não enviada vence
  if (row.colecao==="config" && row.id==="caixa") { if (!apagado && row.dados) S.caixa = row.dados; }
  else if (S[row.colecao]) {
    S[row.colecao] = S[row.colecao].filter(x => x.id!==row.id);
    if (!apagado) S[row.colecao].push({...row.dados, id:row.id});
  } else return;
  saveCache(); requestRender();
}
let canal = null;
function ouvirMudancas(){
  if (!sb || canal) return;
  canal = sb.channel("registros-loja")
    .on("postgres_changes", {event:"*", schema:"public", table:"registros"}, p => {
      if (p.eventType==="DELETE") aplicarRemoto(p.old, true); else aplicarRemoto(p.new, false);
    })
    .subscribe(st => { S.aoVivo = st==="SUBSCRIBED"; updateSync(); if (st==="SUBSCRIBED") pull(); });
}
function pararMudancas(){ if (canal) { try { sb.removeChannel(canal); } catch {} canal = null; S.aoVivo = false; } }
async function checarMembro(){
  if (!sb || !S.user) return;
  if (!navigator.onLine) { if (S.membro === null) S.membro = store.get("controle-camisetas-membro", null) === S.user.id ? true : null; return; }
  const { data, error } = await sb.from("membros").select("user_id,nome").eq("user_id", S.user.id).maybeSingle();
  if (error) { S.syncErr = error.message; updateSync(); return; }
  S.membro = !!data;
  if (data && data.nome) { S.nome = data.nome; store.set("kickoff-nome", data.nome); topbar(); }
  if (S.membro) store.set("controle-camisetas-membro", S.user.id); else store.del("controle-camisetas-membro");
}
async function entrarNaLoja(){
  await checarMembro(); S.anim = "in"; render();
  if (S.membro === true) { ouvirMudancas(); pull(); flush(); }
}
function syncState(){
  if (S.local) return {cls:"warn", txt:"Só neste aparelho"};
  if (!navigator.onLine) return {cls:"warn", txt: fila.length ? `Offline · ${fila.length} pendente${fila.length>1?"s":""}` : "Offline"};
  if (S.syncErr) return {cls:"neg", txt:"Erro ao sincronizar"};
  if (flushing || S.syncing || fila.length) return {cls:"info", txt:"Sincronizando"};
  return {cls:"pos", txt: S.aoVivo ? "Ao vivo" : "Sincronizado"};
}
function updateSync(){
  const st = syncState();
  document.querySelectorAll("[data-avatar]").forEach(el => { el.innerHTML = `${esc(iniciais())}<span class="dot ${st.cls}"></span>`; el.title = st.txt; });
  document.querySelectorAll("[data-sync-txt]").forEach(el => { el.innerHTML = `<span class="dot ${st.cls}"></span>${esc(st.txt)}`; });
}
async function put(col, obj){
  const arr = S[col]; const i = arr.findIndex(x=>x.id===obj.id);
  if (i>=0) arr[i]=obj; else arr.push(obj);
  saveCache(); requestRender(); enqueue({tipo:"put", colecao:col, id:obj.id, dados:obj});
}
async function remove(col, id){
  S[col] = S[col].filter(x=>x.id!==id); saveCache(); requestRender(); enqueue({tipo:"del", colecao:col, id});
}
async function setCaixa(c){ S.caixa = c; saveCache(); requestRender(); enqueue({tipo:"put", colecao:"config", id:"caixa", dados:c}); }

/* ---------- cálculos ---------- */
function calc(p){
  const itens = p.itens || [];
  const totalUSD = sum(itens, i=>i.usd);
  const pix = +p.pix || 0, imp = +p.imposto || 0, ent = +p.entrega || 0;
  const n = itens.length || 1;
  const rows = itens.map(i => {
    const w = totalUSD ? (+i.usd||0)/totalUSD : 1/n;
    const custo = pix*w, ri = imp*w, re = ent*w, total = custo+ri+re, venda = +i.venda||0;
    return {...i, w, custo, ri, re, total, venda, lucro: venda-total};
  });
  const custoTotal = pix+imp+ent, vendaTotal = sum(rows,r=>r.venda);
  const recebido = sum(rows.filter(r=>r.pago), r=>r.venda);
  return { rows, totalUSD, cotacao: totalUSD ? pix/totalUSD : 0, custoTotal, vendaTotal, lucro: vendaTotal-custoTotal,
    recebido, falta: vendaTotal-recebido, pagos: rows.filter(r=>r.pago).length, semImposto: !(p.imposto>0) && p.status!=="concluido" };
}
function movimentos(){
  const m = [];
  for (const p of S.pacotes){
    const base = p.criadoEm || 0;
    if (+p.pix>0) m.push({em:p.pixEm||base, data:p.data, desc:"Fornecedor · "+p.nome, obs:"PIX da importação", v:-p.pix, auto:true, pid:p.id});
    if (+p.imposto>0) m.push({em:p.impostoEm||base, desc:"Imposto · "+p.nome, obs:"Taxa da Receita na chegada", v:-p.imposto, auto:true, pid:p.id});
    if (+p.entrega>0) m.push({em:p.entregaEm||base, desc:"Entrega · "+p.nome, obs:"Frete até você", v:-p.entrega, auto:true, pid:p.id});
    for (const i of (p.itens||[])) if (i.pago && +i.venda>0) m.push({em:i.pagoEm||base, desc:(i.cliente||"Cliente")+" pagou", obs:i.descricao+" · "+p.nome, v:+i.venda, auto:true, pid:p.id});
  }
  for (const l of S.lancamentos) m.push({em:l.em, data:l.data, desc:l.tipo==="entrada"?"Entrada":"Saída", obs:l.obs, v:l.tipo==="entrada"?+l.valor:-l.valor, lid:l.id});
  for (const r of S.receber) if (r.recebido) m.push({em:r.recebidoEm||r.em, desc:(r.cliente||"Cliente")+" pagou", obs:r.descricao||"A receber manual", v:+r.valor, rid:r.id});
  return m.sort((a,b)=>b.em-a.em);
}
function totals(){
  const base = S.caixa || {valor:0, em:0};
  const mov = movimentos();
  const depois = mov.filter(x=>x.em > (base.em||0));
  const caixa = (+base.valor||0) + sum(depois, x=>x.v);
  let aReceberPac = 0, qtd = 0, capital = 0, lucroReal = 0, lucroPrev = 0, chegou = 0;
  for (const p of S.pacotes){ const c = calc(p);
    for (const r of c.rows){ if (r.pago) lucroReal += r.lucro; else { aReceberPac += r.venda; qtd++; capital += r.total; lucroPrev += r.lucro; if (p.status==="brasil"||p.status==="concluido") chegou += r.venda; } } }
  const manual = S.receber.filter(r=>!r.recebido);
  const aReceberMan = sum(manual, r=>r.valor);
  return { caixa, base, mov, depois, aReceber: aReceberPac+aReceberMan, aReceberPac, aReceberMan, qtd, qtdMan:manual.length, capital, lucroReal, lucroPrev, chegou };
}
const sortedPacotes = () => [...S.pacotes].sort((a,b)=> (b.data||"").localeCompare(a.data||"") || (b.criadoEm||0)-(a.criadoEm||0));
const pac = id => S.pacotes.find(p=>p.id===id);

const main = $("#main");

function requestRender(){
  const a = document.activeElement;
  if (a && main.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) { pending = true; return; }
  render();
}
main.addEventListener("focusout", () => setTimeout(()=>{ if (pending){ const a=document.activeElement; if(!(a && main.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName))){ pending=false; render(); } } }, 0));

  const y = window.scrollY;

function mesAtual(){

function viewPacotes(){
  const q = S.busca.trim().toLowerCase();
  let list = sortedPacotes();
  if (S.filtro==="abertos") list = list.filter(p=>p.status!=="concluido");
  if (S.filtro==="concluidos") list = list.filter(p=>p.status==="concluido");
  if (q) list = list.filter(p => [p.nome, p.fornecedor, ...(p.itens||[]).flatMap(i=>[i.descricao,i.cliente])].join(" ").toLowerCase().includes(q));
  const c = list.map(calc);
  return `<div class="view">
  ${large("Pacotes", `${plural(S.pacotes.length,"pacote")} no total`, `<button class="round-btn" data-action="new-pacote" aria-label="Novo pacote" title="Novo pacote">${ICONS.plus}</button>`)}

const diaLabel = d => {
  const hoje = new Date(), ontem = new Date(); ontem.setDate(hoje.getDate()-1);
  if (d.toDateString()===hoje.toDateString()) return "Hoje";
  if (d.toDateString()===ontem.toDateString()) return "Ontem";
  return d.toLocaleDateString("pt-BR",{weekday:"short", day:"2-digit", month:"short", year: d.getFullYear()===hoje.getFullYear() ? undefined : "numeric"});
};
const hora = ts => new Date(ts).toLocaleTimeString("pt-BR",{hour:"2-digit", minute:"2-digit"});

/* ---------- relatórios ---------- */
const mesKey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
const mesNome = (k, longo) => new Date(+k.slice(0,4), +k.slice(5,7)-1, 1).toLocaleDateString("pt-BR", longo ? {month:"long", year:"numeric"} : {month:"short"}).replace(".","");
function serieMensal(meses){
  const map = new Map();
  for (const p of S.pacotes){
    const k = String(p.data||"").slice(0,7); if (!/^\d{4}-\d{2}$/.test(k)) continue;
    const c = calc(p); const o = map.get(k) || {k, pac:0, cam:0, venda:0, custo:0, lucro:0, pacotes:[]};
    o.pac++; o.cam += c.rows.length; o.venda += c.vendaTotal; o.custo += c.custoTotal; o.lucro += c.lucro; o.pacotes.push(p); map.set(k, o);
  }
  const now = new Date(); let ini;
  if (meses) ini = new Date(now.getFullYear(), now.getMonth()-meses+1, 1);
  else { const ks = [...map.keys()].sort(); ini = ks.length ? new Date(+ks[0].slice(0,4), +ks[0].slice(5,7)-1, 1) : new Date(now.getFullYear(), now.getMonth(), 1); }
  const fim = mesKey(now), out = [];
  for (const d = new Date(ini); mesKey(d) <= fim; d.setMonth(d.getMonth()+1)) { const k = mesKey(d); out.push(map.get(k) || {k, pac:0, cam:0, venda:0, custo:0, lucro:0, pacotes:[]}); }
  return out;
}
const compact = v => S.oculto ? "•••" : Math.abs(v) >= 1000 ? "R$ " + (v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mil" : "R$ " + Math.round(v).toLocaleString("pt-BR");
function niceMax(v){ if (v <= 0) return 0; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }
function chartLucro(serie){
  const W = Math.max(300, Math.min(1100, (main.clientWidth || 640) - 38)), H = 230, L = 58, R = 8, T = 10, B = 200; // desenhado na largura real, sem esticar as letras
  const maxV = niceMax(Math.max(0, ...serie.map(s=>s.lucro))), minV = -niceMax(Math.max(0, ...serie.map(s=>-s.lucro)));
  const span = (maxV - minV) || 1, y = v => T + (maxV - v) / span * (B - T);
  const n = serie.length, band = (W - L - R) / n, bw = Math.max(4, Math.min(34, band * .58));
  const ticks = [...new Set([maxV, maxV/2, 0, ...(minV < 0 ? [minV] : [])])];
  const passo = n > 12 ? Math.ceil(n/12) : 1;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lucro por mês">`;
  for (const v of ticks) svg += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?"rgba(255,255,255,.22)":"rgba(255,255,255,.06)"}" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${esc(compact(v))}</text>`;
  serie.forEach((s, i) => {
    const cx = L + band*i + band/2, x = cx - bw/2, y0 = y(0), y1 = y(s.lucro), h = Math.abs(y1 - y0);
    if (h > .5){
      const top = Math.min(y0, y1), r = Math.min(4, h);
      const cor = s.lucro >= 0 ? "#dcdce1" : "var(--red)";
      svg += s.lucro >= 0
        ? `<path d="M${x},${y0} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${y0} Z" fill="${cor}"/>`
        : `<path d="M${x},${y0} V${y1-r} Q${x},${y1} ${x+r},${y1} H${x+bw-r} Q${x+bw},${y1} ${x+bw},${y1-r} V${y0} Z" fill="${cor}"/>`;
    }
    if (i % passo === 0) svg += `<text x="${cx}" y="${H-10}" text-anchor="middle">${esc(mesNome(s.k))}</text>`;
    const tip = `<b>${esc(mesNome(s.k, true))}</b><div class="ln"><span>Lucro</span><span>${esc(signed(s.lucro))}</span></div><div class="ln"><span>Venda</span><span>${esc(brl(s.venda))}</span></div><div class="ln"><span>Custo</span><span>${esc(brl(s.custo))}</span></div><div class="ln"><span>Camisetas</span><span>${s.cam}</span></div>`;
    svg += `<rect class="hit" x="${L + band*i}" y="${T}" width="${band}" height="${B - T}" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(mesNome(s.k,true))}: lucro ${esc(signed(s.lucro))}"/>`;
  });
  return svg + `</svg>`;
}
function viewRelatorios(){
  const per = String(S.relPer);
  const serie = serieMensal(+per);
  const pacotes = serie.flatMap(s => s.pacotes);
  const rows = pacotes.flatMap(p => calc(p).rows);
  const venda = sum(serie, s=>s.venda), lucro = sum(serie, s=>s.lucro), cam = rows.length;
  const recebido = sum(rows.filter(r=>r.pago), r=>r.venda);
  const vers = VERSOES.map(([k,l]) => { const rs = rows.filter(r => (r.versao||"fan")===k); return {k, l, n:rs.length, lucro:sum(rs,r=>r.lucro)}; });
  const clientes = new Map();
  for (const r of rows){ const nome = (r.cliente||"").trim(); if (!nome) continue; const key = nome.toLowerCase();
    const o = clientes.get(key) || {nome, n:0, venda:0, falta:0}; o.n++; o.venda += r.venda; if (!r.pago) o.falta += r.venda; clientes.set(key, o); }

      <div class="card hbars">${vers.map(v => `<div class="hbar"><div class="hl"><span>${esc(v.l)}</span><span>${plural(v.n,"camiseta")} · ${cam ? Math.round(v.n/cam*100) : 0}% · lucro ${brl(v.lucro)}</span></div>

      ${top.length ? `<div class="card list">${top.map(o => `<div class="row"><span class="ic ini">${esc((o.nome.split(/\s+/).map(x=>x[0]).join("").slice(0,2)).toUpperCase())}</span>
        <span class="main"><span class="t">${esc(o.nome)}</span><span class="sub">${plural(o.n,"camiseta")}${o.falta ? ` · falta ${brl(o.falta)}` : " · tudo pago"}</span></span>
        <span class="end"><span class="v">${brl(o.venda)}</span></span></div>`).join("")}</div>`
      : `<div class="card empty"><b>Sem clientes no período</b>Preencha o cliente nas camisetas para ver o ranking.</div>`}

/* ---------- sheet ---------- */
const sheet = $("#sheet"), form = $("#sheet-form");
let sheetCfg = null;
function openSheet(cfg){
  sheetCfg = cfg;
  $("#sheet-title").textContent = cfg.title;
  $("#sheet-ok").textContent = cfg.ok || "Salvar";
  const v = cfg.values || {};
  const field = f => {
    const id = "sf-"+f.id, val = v[f.id] ?? f.value ?? "";
    let input;
    if (f.type==="select") input = `<select id="${id}">${f.options.map(([k,l])=>`<option value="${esc(k)}" ${String(val)===k?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
    else if (f.type==="seg") input = `<input type="hidden" id="${id}" value="${esc(val)}"><div class="seg" role="group"><span class="thumb"></span>${f.options.map(([k,l])=>`<button type="button" data-segv="${esc(k)}" aria-pressed="${String(val)===k}">${esc(l)}</button>`).join("")}</div>`;
    else if (f.type==="textarea") input = `<textarea id="${id}" placeholder="${esc(f.ph||"")}">${esc(val)}</textarea>`;
    else if (f.type==="money"||f.type==="usd") input = `<span class="pre"><em>${f.type==="usd"?"US$":"R$"}</em><input id="${id}" inputmode="decimal" placeholder="0,00" value="${esc(moneyStr(val))}" autocomplete="off"></span>`;
    else input = `<input id="${id}" type="${f.type||"text"}" placeholder="${esc(f.ph||"")}" value="${esc(val)}" autocomplete="off" ${f.list?`list="${id}-l"`:""}>${f.list?`<datalist id="${id}-l">${f.list.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`;
    const tag = f.type==="seg" ? "div" : "label";
    return `<${tag} class="f" data-f="${f.id}"><span>${esc(f.label)}</span>${input}</${tag}>`;
  };
  $("#sheet-body").innerHTML = `${cfg.html||""}${cfg.fields.length?`<div class="list">${cfg.fields.map(field).join("")}</div>`:""}
    ${cfg.note?`<p class="note">${esc(cfg.note)}</p>`:""}
    ${cfg.preview?`<div class="preview" id="sheet-prev"></div>`:""}
    <div class="extra">${cfg.again?`<button type="button" class="btn primary" data-again>Salvar e adicionar outra</button>`:""}
    ${(cfg.buttons||[]).map((b,i)=>`<button type="button" class="btn ${b.cls||""}" data-btn="${i}">${esc(b.label)}</button>`).join("")}
    ${cfg.onDelete?`<button type="button" class="btn danger" data-del>${esc(cfg.delLabel||"Excluir")}</button>`:""}</div>`;
  sheet.hidden = false;
  updatePreview();
  requestAnimationFrame(layoutSegs);
  requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add("open")));
  setTimeout(()=>{ const first = form.querySelector("input,select,textarea"); if (first && matchMedia("(hover:hover)").matches) first.focus(); }, 380);
}
function closeSheet(){
  sheet.classList.remove("open");
  setTimeout(()=>{ if (!sheet.classList.contains("open")) { sheet.hidden = true; sheetCfg = null; } }, 420);
}
function collect(){
  const out = {}; let ok = true;
  for (const f of sheetCfg.fields){
    const el = $("#sf-"+f.id); let val = el.value.trim();
    if (f.type==="money"||f.type==="usd") val = num(val);
    const box = form.querySelector(`[data-f="${f.id}"]`);
    const bad = f.req && (val===""||val===0);
    box.classList.toggle("err", !!bad); if (bad) ok = false;
    out[f.id] = val;
  }
  return ok ? out : null;
}
function updatePreview(){
  if (!sheetCfg || !sheetCfg.preview) return; const box = $("#sheet-prev"); if (!box) return;
  const raw = {}; for (const f of sheetCfg.fields){ const el = $("#sf-"+f.id); if (el) raw[f.id] = (f.type==="money"||f.type==="usd") ? num(el.value) : el.value; }
  box.innerHTML = sheetCfg.preview(raw);
}
form.addEventListener("input", updatePreview);
form.addEventListener("submit", e => { e.preventDefault(); if (!sheetCfg) return; const v = collect(); if (!v) { toast("Preencha os campos destacados"); return; } const cfg = sheetCfg; closeSheet(); cfg.onSubmit(v); });
sheet.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closeSheet(); return; }
  const cb = e.target.closest("[data-btn]");
  if (cb && sheetCfg && sheetCfg.buttons) { const b = sheetCfg.buttons[+cb.dataset.btn]; if (b.close !== false) closeSheet(); b.fn(); return; }
  const sv = e.target.closest("[data-segv]");
  if (sv){ const g = sv.parentElement; g.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===sv ? "true" : "false"));
    g.previousElementSibling.value = sv.dataset.segv; layoutSegs(); updatePreview(); return; }
  if (e.target.closest("[data-again]")) { const v = collect(); if (!v) return; const cfg = sheetCfg; cfg.onSubmit(v); toast("Camiseta adicionada"); openSheet(cfg.again()); return; }
  const del = e.target.closest("[data-del]");
  if (del){ if (del.dataset.armed){ const cfg = sheetCfg; closeSheet(); cfg.onDelete(); } else { del.dataset.armed = "1"; del.textContent = "Toque de novo para confirmar"; del.style.background = "rgba(255,122,112,.16)"; } }
});
document.addEventListener("keydown", e => { if (e.key==="Escape" && !sheet.hidden) closeSheet(); });

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2200); }

const TAMANHOS = ["P","M","G","GG","XGG","2XG","3XG","Infantil"];
function sheetPacote(p){
  const editing = !!p;
  openSheet({
    title: editing ? "Editar pacote" : "Novo pacote", ok: editing ? "Salvar" : "Criar",
    values: p || { nome: "Pacote #" + (S.pacotes.length+1), data: todayISO(), status:"pedido" },
    fields: [
      {id:"nome", label:"Nome do pacote", req:true, ph:"Ex.: Pacote #12"},
      {id:"data", label:"Data do pedido", type:"date"},
      {id:"fornecedor", label:"Fornecedor", ph:"Opcional"},
      ...(editing ? [] : [{id:"pix", label:"Valor pago no PIX", type:"money"}]),
      {id:"status", label:"Situação", type:"select", options:Object.entries(STATUS)},
    ],
    note: editing ? null : "Depois de criar, adicione as camisetas com o preço em dólar de cada uma.",

    delLabel: "Excluir pacote",
    onSubmit: v => {
      if (editing){ const n = clone(p); Object.assign(n, {nome:v.nome, data:v.data, fornecedor:v.fornecedor, status:v.status}); put("pacotes", n); toast("Pacote atualizado"); return; }
      const now = Date.now();
      const n = {id:uid(), nome:v.nome, data:v.data||todayISO(), fornecedor:v.fornecedor||"", status:v.status, pix:v.pix||0, pixEm:now, imposto:0, impostoEm:null, entrega:0, entregaEm:null, obs:"", itens:[], criadoEm:now};
      put("pacotes", n); S.detail = n.id; S.anim = "push"; render(); window.scrollTo(0,0);
      setTimeout(()=>sheetItem(n.id), 450);
    }
  });
}
function sheetItem(pid, item){
  const editing = !!item;
  const clientes = [...new Set(S.pacotes.flatMap(p=>(p.itens||[]).map(i=>i.cliente)).filter(Boolean))];
  const cfg = {
    title: editing ? "Editar camiseta" : "Nova camiseta", ok: editing ? "Salvar" : "Adicionar",
    values: item || {},
    fields: [
      {id:"descricao", label:"Camiseta", req:true, ph:"Ex.: Flamengo 25/26 Home"},
      {id:"versao", label:"Versão", type:"seg", options:VERSOES, value:"fan"},
      {id:"tamanho", label:"Tamanho", list:TAMANHOS, ph:"G"},
      {id:"cliente", label:"Cliente", list:clientes, ph:"Quem pediu"},
      {id:"usd", label:"Preço no fornecedor", type:"usd", req:true},
      {id:"venda", label:"Valor de venda ao cliente", type:"money"},
    ],
    preview: v => {
      const p = pac(pid); if (!p) return "";
      const outros = sum((p.itens||[]).filter(i=>!item || i.id!==item.id), i=>i.usd);
      const totalUSD = outros + (v.usd||0); const pix = +p.pix||0;
      if (!pix) return `<div class="ln"><span>Custo em reais</span><span class="warn">Informe o valor pago no PIX do pacote</span></div>`;
      if (!totalUSD) return `<div class="formula">Digite o preço em dólar para ver o custo em reais.</div>`;
      const dolar = pix/totalUSD, custo = (v.usd||0)*dolar, lucro = (v.venda||0) - custo;
      return `<div class="formula">PIX ${brlRaw(pix)} ÷ ${usd(totalUSD)} no pacote = ${brlRaw(dolar)} por dólar</div>
        <div class="ln big"><span>Custo em reais</span><span>${brlRaw(custo)}</span></div>
        ${v.venda ? `<div class="ln big"><span>Lucro</span><span class="${lucro>=0?"pos":"neg"}">${signedRaw(lucro)}</span></div>` : ""}
        <div class="formula">${p.imposto>0 ? "O imposto rateado desta camiseta é somado ao custo depois de salvar." : "Sem imposto ainda. Quando você preencher o imposto do pacote, ele entra no custo e o lucro é recalculado."}${outros && !item ? " Adicionar esta camiseta reajusta o custo por dólar das outras do pacote." : ""}</div>`;
    },
    onDelete: editing ? () => { const p = clone(pac(pid)); p.itens = p.itens.filter(i=>i.id!==item.id); put("pacotes", p); toast("Camiseta removida"); } : null,
    delLabel: "Remover camiseta",
    onSubmit: v => {
      const p = clone(pac(pid)); if (!p) return;
      if (editing){ const i = p.itens.find(x=>x.id===item.id); Object.assign(i, v); }
      else p.itens.push({id:uid(), ...v, pago:false, pagoEm:null});
      put("pacotes", p);
    },
  };
  if (!editing) cfg.again = () => { const c = {...cfg}; return c; };
  openSheet(cfg);
}

/* ---------- eventos ---------- */
function go(tab){ if (S.tab===tab && !S.detail) return; S.tab = tab; S.detail = null; S.anim = "in"; render(); window.scrollTo({top:0}); }
document.addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el || sheet.contains(el)) return;
  const a = el.dataset.action, id = el.dataset.id, v = el.dataset.v;
  if (false && !["open","back","tab","filtro","fintab"].includes(a)) { toast("Você só tem acesso de leitura"); return; }
  switch(a){
    case "tab": go(v); break;
    case "open": S.detail = id; S.anim = "push"; render(); window.scrollTo(0,0); break;
    case "back": S.detail = null; S.anim = "pop"; render(); window.scrollTo(0,0); break;
    case "new-pacote": sheetPacote(); break;
    case "edit-pacote": sheetPacote(pac(S.detail)); break;
    case "del-pacote":
      if (el.dataset.armed){ remove("pacotes", S.detail); S.detail = null; S.anim = "pop"; render(); toast("Pacote excluído"); }
      else { el.dataset.armed = "1"; el.textContent = "Toque de novo para excluir"; el.style.background = "rgba(255,122,112,.16)"; }
      break;
    case "add-item": sheetItem(S.detail); break;
    case "edit-item": { const p = pac(S.detail); const it = p && p.itens.find(i=>i.id===id); if (it) sheetItem(p.id, it); break; }
    case "pay": { e.stopPropagation(); const p = clone(pac(el.dataset.pid)); const it = p.itens.find(i=>i.id===id); it.pago = !it.pago; it.pagoEm = it.pago ? Date.now() : null;
      if (p.itens.length && p.itens.every(i=>i.pago) && p.status==="brasil") { p.status = "concluido"; toast("Tudo recebido. Pacote concluído"); } else toast(it.pago ? `${it.cliente||"Cliente"} pagou ${brl(it.venda)}` : "Marcado como a receber");
      put("pacotes", p); break; }
    case "status": { const p = clone(pac(S.detail)); p.status = v; put("pacotes", p); break; }
    case "filtro": S.filtro = v; render(); break;
    case "fintab": S.finTab = v; render(); break;
    case "new-lanc": sheetLanc(v||"entrada"); break;
    case "edit-lanc": { const l = S.lancamentos.find(x=>x.id===id); if (l) sheetLanc(l.tipo, l); break; }
    case "new-receber": sheetReceber(); break;
    case "edit-receber": { const r = S.receber.find(x=>x.id===id); if (r) sheetReceber(r); break; }
    case "recebi": { e.stopPropagation(); const r = clone(S.receber.find(x=>x.id===id)); r.recebido = true; r.recebidoEm = Date.now(); put("receber", r); toast(`Recebido ${brl(r.valor)}`); break; }
    case "caixa-hoje": sheetCaixa(); break;
    case "conta": sheetConta(); break;
    case "recheck": entrarNaLoja(); break;
    case "sair": sair(); break;
    case "oculto": e.stopPropagation(); S.oculto = !S.oculto; store.set("kickoff-oculto", S.oculto); render(); break;
    case "relper": S.relPer = +v; render(); break;
    case "exportar": exportar(); break;
    case "ver-receber": S.finTab = "receber"; go("financeiro"); break;
  }
});
document.addEventListener("keydown", e => { if ((e.key==="Enter"||e.key===" ") && e.target.matches(".item[data-action]")) { e.preventDefault(); e.target.click(); } });
main.addEventListener("change", e => {
  const el = e.target; const f = el.dataset.pf; if (!f || !S.detail) return;
  if (false) { toast("Você só tem acesso de leitura"); return; }
  const p = clone(pac(S.detail));

  else { const val = num(el.value); if (val===(+p[f]||0)) { el.value = moneyStr(val); return; }
    p[f] = val; const k = f+"Em"; if (val>0 && !p[k]) p[k] = Date.now();
    if (f==="imposto" && val>0 && (p.status==="pedido"||p.status==="transito")) p.status = "brasil";

/* dica dos gráficos (passar o mouse, tocar ou navegar pelo teclado) */
function chartTip(e){
  const h = e.target.closest && e.target.closest("[data-tip]");
  document.querySelectorAll(".tip.show").forEach(t => { if (!h || !h.closest(".chart").contains(t)) t.classList.remove("show"); });
  if (!h) return;
  const box = h.closest(".chart"), t = box.querySelector(".tip"); if (!t) return;
  const r = h.getBoundingClientRect(), b = box.getBoundingClientRect();
  t.innerHTML = h.dataset.tip;
  const w = t.offsetWidth || 180, x = r.left + r.width/2 - b.left;
  t.style.left = Math.max(w/2 + 8, Math.min(b.width - w/2 - 8, x)) + "px";
  t.classList.add("show");
}
document.addEventListener("pointerover", chartTip, {passive:true});
document.addEventListener("focusin", chartTip);
addEventListener("scroll", () => $("#topbar").classList.toggle("scrolled", scrollY > 36), {passive:true});
let resizeT; addEventListener("resize", () => { layoutSegs(); clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.tab==="relatorios" && !S.detail && !(sheet && !sheet.hidden)) render(); }, 200); });

      <div class="field-row"><label>Dados<span class="hint">Compartilhados com todos os membros da loja</span></label><span class="val">${S.membro ? "Loja" : "—"}</span></div>
      <div class="field-row"><label>Pendentes de envio</label><span class="val">${fila.length}</span></div></div>
      <p class="note">O backup é um arquivo com todos os pacotes, lançamentos e o caixa. Guarde no app Arquivos ou no iCloud.</p>`,
    buttons:[
      ...(sb && S.user ? [{label:"Sincronizar agora", cls:"primary", fn:()=>{ S.syncErr = null; pull(); toast("Sincronizando"); }}] : []),
      {label:"Exportar backup", fn:exportar},
      {label:"Importar backup", fn:()=>$("#import-file").click()},
      ...(sb && S.user ? [{label:"Sair da conta", cls:"danger", fn:sair}] : []),
    ],
    onSubmit:()=>{}
  });
}
function exportar(){
  const blob = new Blob([JSON.stringify({app:"controle-camisetas", versao:1, exportadoEm:new Date().toISOString(), pacotes:S.pacotes, lancamentos:S.lancamentos, receber:S.receber, caixa:S.caixa}, null, 1)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `backup-camisetas-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast("Backup exportado");
}
$("#import-file").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "controle-camisetas") throw new Error("arquivo inválido");
    for (const c of ["pacotes","lancamentos","receber"]) for (const o of (d[c]||[])) if (o && o.id) put(c, o);
    if (d.caixa) setCaixa(d.caixa);
    toast("Backup importado");
  } catch { toast("Esse arquivo não é um backup deste app"); }
});
async function sair(){
  if (fila.length && !navigator.onLine) { toast("Conecte-se à internet antes de sair, há dados pendentes"); return; }
  await flush();
  pararMudancas();
  await sb.auth.signOut();
  store.del("controle-camisetas-membro");
  store.del(LS); store.del(LQ); fila = [];
  Object.assign(S, {pacotes:[], lancamentos:[], receber:[], caixa:{valor:0,em:0}, user:null, membro:null, detail:null, tab:"resumo"});
  render();
}
main.addEventListener("submit", async e => {
  if (e.target.id !== "login-form") return;
  e.preventDefault();
  const email = $("#lg-email").value.trim(), senha = $("#lg-senha").value, err = $("#lg-err"), ok = $("#lg-ok");
  if (!email || !senha) { err.textContent = "Preencha e-mail e senha."; return; }
  ok.disabled = true; ok.textContent = "Entrando…"; err.textContent = "";
  const { error } = await sb.auth.signInWithPassword({email, password:senha});
  ok.disabled = false; ok.textContent = "Entrar";
  if (error) err.textContent = /invalid/i.test(error.message) ? "E-mail ou senha incorretos."
    : /fetch|network/i.test(error.message) ? "Sem conexão com o servidor. Verifique a internet e tente de novo."
    : /confirm/i.test(error.message) ? "Esse e-mail ainda não foi confirmado no Supabase."
    : "Não foi possível entrar: " + error.message;
});

/* ---------- inicialização ---------- */
async function boot(){
  loadCache();
  if (!sb){ S.local = true; S.ready = true; S.anim = "in"; render(); return; }
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch {}
  S.user = session ? session.user : null;
  if (S.user && store.get("controle-camisetas-membro", null) === S.user.id) S.membro = true; // abre direto com o cache
  S.ready = true; S.anim = "in"; render();
  sb.auth.onAuthStateChange((ev, sess) => {
    const prev = S.user && S.user.id; S.user = sess ? sess.user : null;
    if (S.user && S.user.id !== prev) { S.membro = null; setTimeout(entrarNaLoja, 0); }
  });
  if (S.user) entrarNaLoja();
  addEventListener("online", () => { updateSync(); if (S.membro === null) entrarNaLoja(); else pull(); });
  addEventListener("offline", updateSync);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
  setInterval(() => { if (document.visibilityState === "visible" && !S.aoVivo) pull(); }, 60000);
}
const LOGO = "img/logo.png";
boot();
})();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
